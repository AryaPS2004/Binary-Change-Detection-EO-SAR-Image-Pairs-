PROJECT:
  NAME: "EO_SAR_Change_Detection"

DATA:
  ROOT: "./datasets"
  IMAGE_SIZE: 256
  NUM_WORKERS: 4

MODEL:
  EO_ENCODER: "resnet50"
  SAR_ENCODER: "resnet50"
  PRETRAINED: True

TRAIN:
  BATCH_SIZE: 2
  EPOCHS: 20
  LR: 0.0001
  WEIGHT_DECAY: 0.0001
  DEVICE: "cuda"

LOSS:
  ALPHA: 0.75
  GAMMA: 2.0
  DICE_WEIGHT: 0.5

THRESHOLD:
  DEFAULT: 0.5

CHECKPOINT:
  SAVE_DIR: "./checkpoints"

OUTPUT:
  PRED_DIR: "./outputs/predictions"
  VIS_DIR: "./outputs/visualizations"
  LOG_DIR: "./outputs/logs"